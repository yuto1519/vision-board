<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#e8c547;--bg:#080808;--bg2:#0e0e0e;--bg3:#141414;--border:#1a1a1a;--text:#ccc;--muted:#555}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;overflow:hidden}
.app{display:flex;height:100vh;width:100vw}

.sidebar{width:52px;background:var(--bg2);border-right:1px solid #161616;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;flex-shrink:0;z-index:50;overflow-y:auto;overflow-x:hidden}
.s-logo{font-family:'Bebas Neue',cursive;font-size:11px;letter-spacing:3px;color:#2a2a2a;writing-mode:vertical-lr;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid #161616;width:100%;text-align:center}
.s-btn{width:36px;height:36px;border-radius:8px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333;transition:all .18s;flex-shrink:0;position:relative}
.s-btn:hover{background:#161616;color:#888}
.s-btn.active{background:#1a1a1a;color:var(--accent)}
.s-btn i{font-size:16px}
.s-divider{width:28px;height:1px;background:#161616;margin:3px 0;flex-shrink:0}
.s-add{width:36px;height:36px;border-radius:8px;border:1px solid #222;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .18s;margin-top:auto;flex-shrink:0}
.s-add:hover{border-color:var(--accent);color:var(--accent);background:#1a1008}
.s-add i{font-size:18px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:44px;background:#0a0a0a;border-bottom:1px solid #141414;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.tb-title{font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:3px;color:#252525;flex:1}
.tb-filter-badge{font-size:10px;color:#444;letter-spacing:1px;border:1px solid #1e1e1e;padding:3px 10px;border-radius:20px;white-space:nowrap;transition:all .2s}
.tb-filter-badge.on{color:var(--accent);border-color:var(--accent);background:#e8c5470a}
.tb-count{font-size:11px;color:#222;letter-spacing:1px;white-space:nowrap}
.tb-sep{width:1px;height:16px;background:#181818;flex-shrink:0}
.tb-action{height:28px;padding:0 12px;border-radius:6px;border:1px solid #1e1e1e;background:none;color:#444;font-size:11px;letter-spacing:1px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tb-action:hover{border-color:#333;color:#888}
.tb-action i{font-size:13px}

.canvas{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(circle,#161616 1px,transparent 1px);background-size:24px 24px}
.canvas-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.canvas-empty i{font-size:40px;color:#181818}
.canvas-empty p{font-size:12px;color:#1e1e1e;letter-spacing:2px}
.hint{position:absolute;bottom:12px;right:14px;font-size:10px;color:#181818;letter-spacing:1px;pointer-events:none}

.tile{position:absolute;border-radius:10px;overflow:visible;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:border-color .2s;touch-action:none}
.tile-inner{position:absolute;inset:0;border-radius:9px;overflow:hidden}
.tile.dragging{cursor:grabbing;z-index:500}
.tile.filter-view{transition:left .38s cubic-bezier(.4,0,.2,1),top .38s cubic-bezier(.4,0,.2,1),width .38s,height .38s}
.tile.hidden-tile{opacity:0;pointer-events:none;transition:opacity .2s}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:transform .35s}
.tile:hover img{transform:scale(1.04)}
.tile-ov{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.8) 100%);pointer-events:none;opacity:0;transition:opacity .2s}
.tile:hover .tile-ov{opacity:1}
.tile-lbl{position:absolute;bottom:0;left:0;right:0;padding:10px 11px;opacity:0;transition:opacity .2s;pointer-events:none}
.tile:hover .tile-lbl{opacity:1}
.tile-cat{font-size:9px;font-weight:500;letter-spacing:2px;margin-bottom:2px;text-transform:uppercase;transition:color .2s}
.tile-name{font-size:13px;color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-date{font-size:9px;color:#666;margin-top:2px;letter-spacing:.5px}
.pin-mark{position:absolute;top:0;left:0;width:0;height:0;border-style:solid;border-width:22px 22px 0 0;pointer-events:none;z-index:5;transition:border-color .2s}
.no-img{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#111}
.no-img i{font-size:28px;color:#222}
.achieved-badge{position:absolute;top:8px;right:8px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:3px 8px;font-size:9px;letter-spacing:1px;color:#555;pointer-events:none;z-index:6;display:flex;align-items:center;gap:4px}
.achieved-badge.done{color:#47e8a0;border-color:#47e8a044;background:#0a1a12}

/* 四隅グロー */
.corner-glow{position:absolute;pointer-events:none;z-index:10;opacity:0;transition:opacity .2s;border-radius:3px}
.corner-glow.tl{top:-2px;left:-2px;width:14px;height:14px;border-top:2px solid;border-left:2px solid;border-top-left-radius:8px}
.corner-glow.tr{top:-2px;right:-2px;width:14px;height:14px;border-top:2px solid;border-right:2px solid;border-top-right-radius:8px}
.corner-glow.bl{bottom:-2px;left:-2px;width:14px;height:14px;border-bottom:2px solid;border-left:2px solid;border-bottom-left-radius:8px}
.corner-glow.br{bottom:-2px;right:-2px;width:14px;height:14px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:8px}
.tile:hover .corner-glow{opacity:1}

/* リサイズハンドル */
.rh{position:absolute;z-index:20;opacity:0;transition:opacity .15s}
.tile:hover .rh{opacity:1}
.tile.filter-view .rh{display:none}
.rh-se{bottom:-5px;right:-5px;width:16px;height:16px;cursor:se-resize}
.rh-sw{bottom:-5px;left:-5px;width:16px;height:16px;cursor:sw-resize}
.rh-ne{top:-5px;right:-5px;width:16px;height:16px;cursor:ne-resize}
.rh-nw{top:-5px;left:-5px;width:16px;height:16px;cursor:nw-resize}
.rh-n{top:-4px;left:50%;transform:translateX(-50%);width:28px;height:9px;cursor:n-resize}
.rh-s{bottom:-4px;left:50%;transform:translateX(-50%);width:28px;height:9px;cursor:s-resize}
.rh-e{right:-4px;top:50%;transform:translateY(-50%);width:9px;height:28px;cursor:e-resize}
.rh-w{left:-4px;top:50%;transform:translateY(-50%);width:9px;height:28px;cursor:w-resize}
.rh-corner{width:100%;height:100%;background:var(--accent);border-radius:50%}
.rh-edge-h{width:100%;height:3px;background:var(--accent);border-radius:2px;position:absolute;top:50%;transform:translateY(-50%)}
.rh-edge-v{width:3px;height:100%;background:var(--accent);border-radius:2px;position:absolute;left:50%;transform:translateX(-50%)}

.float-tb{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg2);border:1px solid #1e1e1e;border-radius:10px;padding:5px 7px;display:flex;align-items:center;gap:3px;z-index:400;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.float-tb.visible{opacity:1;pointer-events:all;transform:translateX(-50%) translateY(0)}
.tf-btn{height:30px;padding:0 10px;border-radius:6px;border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;gap:5px;letter-spacing:.5px}
.tf-btn:hover{background:#1a1a1a;color:#aaa}
.tf-btn.pin-on{color:var(--accent)}
.tf-btn.achieved-on{color:#47e8a0}
.tf-btn i{font-size:14px}
.tf-sep{width:1px;height:18px;background:#1e1e1e}
.tf-del:hover{color:#e84747!important}

.ctx{position:fixed;background:var(--bg2);border:1px solid #1e1e1e;border-radius:9px;padding:4px;z-index:2000;min-width:140px;box-shadow:0 8px 32px rgba(0,0,0,.8)}
.ctx-item{padding:7px 11px;font-size:12px;color:#666;cursor:pointer;border-radius:6px;transition:background .1s,color .1s;display:flex;align-items:center;gap:8px}
.ctx-item i{font-size:14px}
.ctx-item:hover{background:#161616;color:#ccc}
.ctx-item.red:hover{color:#e84747}
.ctx-sep{height:1px;background:#1a1a1a;margin:3px 0}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid #1e1e1e;border-radius:14px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto}
.mhdr{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:center}
.mttl{font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:3px;color:var(--muted)}
.mcls{background:none;border:none;color:#333;font-size:16px;cursor:pointer;transition:color .15s;padding:4px}
.mcls:hover{color:#888}
.mbody{padding:14px 18px 18px;display:flex;flex-direction:column;gap:9px}
.minp{width:100%;background:#141414;border:1px solid #1e1e1e;border-radius:8px;padding:9px 11px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.minp:focus{border-color:#e8c54766}
.minp::placeholder{color:#2e2e2e}
.m-label{font-size:10px;color:#3a3a3a;letter-spacing:1px}
.tab-row{display:flex;gap:5px}
.mtab{padding:4px 12px;border-radius:20px;border:none;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.mtab.on{background:var(--accent);color:#000}
.mtab.off{background:#161616;color:#444}
.mprev{width:100%;height:100px;object-fit:cover;border-radius:8px;display:block}
.mdrop{border:1px dashed #1e1e1e;border-radius:8px;padding:18px;text-align:center;cursor:pointer;color:#2e2e2e;font-size:11px;transition:border-color .15s}
.mdrop:hover{border-color:#333;color:var(--muted)}
.msub{width:100%;background:var(--accent);color:#000;border:none;border-radius:8px;padding:11px;font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:3px;cursor:pointer}
.msub:hover{opacity:.85}
.m-row{display:flex;gap:8px;align-items:center}
.m-check-label{font-size:12px;color:#555;display:flex;align-items:center;gap:6px;cursor:pointer}
.m-check-label input{accent-color:var(--accent)}

/* 詳細 */
.det-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1100;display:flex;align-items:center;justify-content:center;padding:20px}
.det-card{background:var(--bg2);border:1px solid #1e1e1e;border-radius:14px;width:100%;max-width:440px;overflow:hidden;position:relative;max-height:92vh;overflow-y:auto}
.det-img-wrap{width:100%;height:210px;overflow:hidden;flex-shrink:0}
.det-img{width:100%;height:100%;object-fit:cover;display:block}
.det-no-img{width:100%;height:120px;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-no-img i{font-size:36px;color:#222}
.det-body{padding:16px 20px 20px}
.det-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.det-cat{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.det-date-badge{font-size:9px;color:#444;letter-spacing:.5px;border:1px solid #1e1e1e;padding:2px 8px;border-radius:20px}
.det-achieved-badge{font-size:9px;letter-spacing:.5px;border:1px solid #47e8a044;padding:2px 8px;border-radius:20px;color:#47e8a0;background:#0a1a12}
.det-title{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:2px;color:#ddd;margin-bottom:6px}
.det-note{font-size:12px;color:#555;line-height:1.7;margin-bottom:14px;min-height:4px}
.det-actions{display:flex;gap:8px;flex-wrap:wrap}
.det-lnk{flex:1;min-width:80px;background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;text-decoration:none;text-align:center;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:opacity .15s}
.det-lnk:hover{opacity:.85}
.det-btn{background:none;border:1px solid #1e1e1e;color:#666;border-radius:8px;padding:10px 14px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:5px}
.det-btn:hover{color:#ccc;border-color:#333}
.det-btn.pin-on{color:var(--accent);border-color:#e8c54766}
.det-btn.achieved-on{color:#47e8a0;border-color:#47e8a044;background:#0a1a12}
.det-btn.del:hover{color:#e84747;border-color:#e8474744}
.det-close{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.6);border:none;color:#888;font-size:16px;cursor:pointer;border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;z-index:5;transition:color .15s}
.det-close:hover{color:#fff}

/* 達成一覧 */
.ach-wrap{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px}
.ach-modal{background:var(--bg2);border:1px solid #1e1e1e;border-radius:14px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.ach-hdr{padding:16px 20px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.ach-ttl{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:3px;color:#47e8a0}
.ach-list{overflow-y:auto;flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ach-item{background:var(--bg3);border:1px solid #1e1e1e;border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.ach-thumb{width:52px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#111}
.ach-thumb-empty{width:52px;height:40px;border-radius:6px;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ach-thumb-empty i{font-size:18px;color:#222}
.ach-info{flex:1;min-width:0}
.ach-name{font-size:13px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.ach-dates{font-size:10px;color:#444;letter-spacing:.5px}
.ach-cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ach-empty{text-align:center;padding:40px;color:#2a2a2a;font-size:12px;letter-spacing:1px}

/* カラーピッカー */
.color-picker-wrap{position:fixed;background:var(--bg2);border:1px solid #1e1e1e;border-radius:10px;padding:12px;z-index:3000;box-shadow:0 8px 32px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:8px;min-width:160px}
.cp-label{font-size:10px;color:#444;letter-spacing:1px}
.cp-presets{display:flex;flex-wrap:wrap;gap:6px}
.cp-preset{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;transition:transform .15s;flex-shrink:0}
.cp-preset:hover{transform:scale(1.2)}
.cp-custom{width:100%;height:28px;border-radius:6px;border:1px solid #2a2a2a;background:#141414;cursor:pointer;padding:0}

@media(max-width:599px){
  .sidebar{display:none}
  .tb-count,.tb-sep{display:none}
  .mobile-bar{display:flex}
  .canvas{padding-bottom:70px}
}
.mobile-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid #161616;padding:8px 16px 20px;z-index:300;justify-content:space-around;align-items:center}
.mb-btn{background:none;border:none;color:#333;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;letter-spacing:1px;font-family:'DM Sans',sans-serif;transition:color .15s;padding:4px 8px}
.mb-btn.active,.mb-btn:hover{color:var(--accent)}
.mb-btn i{font-size:20px}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="s-logo">VB</div>
    <button class="s-btn active" id="btn-all" title="すべて"><i class="ti ti-apps"></i></button>
    <button class="s-btn" id="btn-pin" title="ピン留めのみ"><i class="ti ti-pin"></i></button>
    <button class="s-btn" id="btn-achieved" title="達成済み一覧"><i class="ti ti-trophy"></i></button>
    <div class="s-divider"></div>
    <button class="s-btn cat-btn" data-cat="欲しいもの" title="欲しいもの"><i class="ti ti-shopping-bag"></i></button>
    <button class="s-btn cat-btn" data-cat="行きたい場所" title="行きたい場所"><i class="ti ti-map-pin"></i></button>
    <button class="s-btn cat-btn" data-cat="目標・夢" title="目標・夢"><i class="ti ti-star"></i></button>
    <button class="s-btn cat-btn" data-cat="ライフスタイル" title="ライフスタイル"><i class="ti ti-heart"></i></button>
    <button class="s-btn cat-btn" data-cat="その他" title="その他"><i class="ti ti-dots"></i></button>
    <div class="s-divider"></div>
    <button class="s-btn" id="btn-shuffle" title="整列"><i class="ti ti-layout-distribute-horizontal"></i></button>
    <button class="s-btn" id="btn-clear" title="全削除" style="color:#e8474744"><i class="ti ti-trash"></i></button>
    <button class="s-add" id="open-add-side"><i class="ti ti-plus"></i></button>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="tb-title">VISION BOARD</span>
      <span class="tb-filter-badge" id="tb-badge">ALL</span>
      <span class="tb-count" id="tb-count">0 ITEMS</span>
      <div class="tb-sep"></div>
      <button class="tb-action" id="open-add-top" style="border-color:#e8c54733;color:var(--accent);background:#e8c5470a"><i class="ti ti-plus"></i> 追加</button>
    </div>
    <div class="canvas" id="canvas">
      <div class="canvas-empty" id="canvas-empty">
        <i class="ti ti-layout-board-split"></i>
        <p>＋ 追加 からアイテムを登録しよう</p>
      </div>
      <div class="hint">クリックで詳細 · ドラッグで移動 · 辺でリサイズ · 右クリックでメニュー</div>
      <div class="float-tb" id="float-tb">
        <button class="tf-btn" id="tf-pin"><i class="ti ti-pin"></i> ピン</button>
        <button class="tf-btn" id="tf-achieved"><i class="ti ti-trophy"></i> 達成</button>
        <div class="tf-sep"></div>
        <button class="tf-btn" id="tf-edit"><i class="ti ti-edit"></i> 編集</button>
        <div class="tf-sep"></div>
        <button class="tf-btn" id="tf-front"><i class="ti ti-bring-to-front"></i> 前面</button>
        <button class="tf-btn" id="tf-back"><i class="ti ti-send-to-back"></i> 背面</button>
        <div class="tf-sep"></div>
        <button class="tf-btn tf-del" id="tf-del"><i class="ti ti-trash"></i></button>
      </div>
    </div>
  </div>

  <div class="mobile-bar">
    <button class="mb-btn active" id="mb-all"><i class="ti ti-apps"></i>すべて</button>
    <button class="mb-btn" id="mb-pin"><i class="ti ti-pin"></i>ピン</button>
    <button class="mb-btn" id="mb-add"><i class="ti ti-plus"></i>追加</button>
    <button class="mb-btn" id="mb-achieved"><i class="ti ti-trophy"></i>達成</button>
  </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx" id="ctx" style="display:none">
  <div class="ctx-item" id="ctx-detail"><i class="ti ti-eye"></i> 詳細</div>
  <div class="ctx-item" id="ctx-edit"><i class="ti ti-edit"></i> 編集</div>
  <div class="ctx-item" id="ctx-pin"><i class="ti ti-pin"></i> <span id="ctx-pin-lbl">ピン留め</span></div>
  <div class="ctx-item" id="ctx-achieved"><i class="ti ti-trophy"></i> <span id="ctx-ach-lbl">達成済みにする</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-front"><i class="ti ti-bring-to-front"></i> 最前面へ</div>
  <div class="ctx-item" id="ctx-back"><i class="ti ti-send-to-back"></i> 最背面へ</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctx-color"><i class="ti ti-palette"></i> カテゴリの色を変更</div>
  <div class="ctx-sep"></div>

<!-- カラーピッカー -->
<div class="color-picker-wrap" id="color-picker" style="display:none">
  <div class="cp-label">カテゴリカラー</div>
  <div class="cp-presets" id="cp-presets"></div>
  <input type="color" class="cp-custom" id="cp-custom" title="カスタムカラー">
</div>

<script>
const DEFAULT_CAT_C={欲しいもの:"#e8c547",行きたい場所:"#47b8e8","目標・夢":"#e84778",ライフスタイル:"#47e8a0",その他:"#b847e8"};
const COLOR_PRESETS=["#e8c547","#47b8e8","#e84778","#47e8a0","#b847e8","#e87347","#e84747","#47e8d4","#a0e847","#e8a0e8","#7847e8","#e8e847"];
const STORAGE_KEY="visionboard_v4";
const CAT_COLOR_KEY="vb_cat_colors_v4";

let items=[],maxZ=0,selId=null,ctxId=null,detId=null,editId=null;
let imgTab="url",pendingImg="",eImgTab="url",ePendingImg="";
let filterMode="all",dragMoved=false;
let catColors={...DEFAULT_CAT_C};
let colorPickerCat=null;

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(items));localStorage.setItem(CAT_COLOR_KEY,JSON.stringify(catColors));}catch(e){}}
function load(){
  try{const d=localStorage.getItem(STORAGE_KEY);if(d){items=JSON.parse(d);maxZ=Math.max(0,...items.map(i=>i.z||0));}}catch(e){items=[];}
  try{const c=localStorage.getItem(CAT_COLOR_KEY);if(c){catColors={...DEFAULT_CAT_C,...JSON.parse(c)};}}catch(e){}
}
function cc(cat){return catColors[cat]||"#888"}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d) return "";const[y,m,dd]=d.split("-");return `${y}/${m}/${dd}`;}

const canvas=document.getElementById("canvas");
const floatTb=document.getElementById("float-tb");
const ctxMenu=document.getElementById("ctx");

function gi(id){return items.find(i=>i.id===id)}

function getVisible(){
  if(filterMode==="all") return items;
  if(filterMode==="pin") return items.filter(i=>i.pinned);
  if(filterMode==="achieved") return items.filter(i=>i.achieved);
  return items.filter(i=>i.category===filterMode);
}
function isFilterView(){return filterMode!=="all";}

function updateTopbar(){
  const labels={all:"ALL",pin:"PINNED",achieved:"ACHIEVED"};
  const badge=document.getElementById("tb-badge");
  const label=labels[filterMode]||filterMode;
  badge.textContent=label;
  badge.classList.toggle("on",filterMode!=="all");
  document.getElementById("tb-count").textContent=getVisible().length+" ITEMS";
  document.getElementById("canvas-empty").style.display=items.length===0?"flex":"none";
}

function calcFilterPos(vis){
  const cr=canvas.getBoundingClientRect();
  const cols=Math.max(1,Math.floor(cr.width/190));
  const pad=16,gp=8;
  const cw=Math.floor((cr.width-pad*2-gp*(cols-1))/cols);
  const ch=Math.round(cw*0.65);
  return vis.map((item,i)=>({id:item.id,x:pad+(i%cols)*(cw+gp),y:pad+Math.floor(i/cols)*(ch+gp),w:cw,h:ch}));
}

function renderAll(){
  const vis=getVisible();
  const fv=isFilterView();
  const fpos=fv?calcFilterPos(vis):null;
  const existing=new Set([...canvas.querySelectorAll(".tile")].map(t=>parseInt(t.dataset.id)));
  items.forEach(item=>{if(!existing.has(item.id)) canvas.appendChild(createTile(item));});
  items.forEach(item=>{
    const t=canvas.querySelector(`[data-id="${item.id}"]`);if(!t) return;
    const inVis=!!vis.find(v=>v.id===item.id);
    if(!inVis){t.classList.add("hidden-tile");t.classList.remove("filter-view");return;}
    t.classList.remove("hidden-tile");
    if(fv&&fpos){
      const fp=fpos.find(p=>p.id===item.id);
      t.classList.add("filter-view");
      t.style.left=fp.x+"px";t.style.top=fp.y+"px";t.style.width=fp.w+"px";t.style.height=fp.h+"px";
    } else {
      t.classList.remove("filter-view");
      t.style.left=item.x+"px";t.style.top=item.y+"px";t.style.width=item.w+"px";t.style.height=item.h+"px";
    }
    t.style.zIndex=item.z;
    applyTileStyle(t,item);
    t.classList.toggle("selected",selId===item.id);
  });
  updateTopbar();
  updateFloatTb();
  updateSidebarCatColors();
}

function applyTileStyle(t,item){
  const color=cc(item.category);
  t.querySelector(".tile-cat").style.color=color;
  t.querySelector(".tile-cat").textContent=item.category;
  t.querySelector(".tile-name").textContent=item.title;
  const dateEl=t.querySelector(".tile-date");
  if(dateEl) dateEl.textContent=item.createdAt?fmtDate(item.createdAt):"";
  const pm=t.querySelector(".pin-mark");
  if(item.pinned){pm.style.display="block";pm.style.borderColor=`${color} transparent transparent transparent`;}
  else pm.style.display="none";
  const ab=t.querySelector(".achieved-badge");
  if(item.achieved){ab.className="achieved-badge done";ab.innerHTML=`<i class="ti ti-check" style="font-size:9px"></i> 達成`;}
  else{ab.className="achieved-badge";ab.innerHTML=`<i class="ti ti-target" style="font-size:9px"></i> 未達成`;}
  // 四隅グロー色
  t.querySelectorAll(".corner-glow").forEach(g=>{g.style.borderColor=color;});
  const img=t.querySelector("img");
  if(img&&item.imageUrl&&img.dataset.src!==item.imageUrl){img.src=item.imageUrl;img.dataset.src=item.imageUrl;}
}

function createTile(item){
  const t=document.createElement("div");
  t.className="tile";t.dataset.id=item.id;
  const color=cc(item.category);
  t.innerHTML=`
    <div class="corner-glow tl" style="border-color:${color}"></div>
    <div class="corner-glow tr" style="border-color:${color}"></div>
    <div class="corner-glow bl" style="border-color:${color}"></div>
    <div class="corner-glow br" style="border-color:${color}"></div>
    <div class="tile-inner">
      ${item.imageUrl?`<img src="${item.imageUrl}" alt="${item.title}" draggable="false" data-src="${item.imageUrl}">`:`<div class="no-img"><i class="ti ti-photo"></i></div>`}
      <div class="tile-ov"></div>
      <div class="pin-mark" style="border-color:${color} transparent transparent transparent;display:${item.pinned?"block":"none"}"></div>
      <div class="achieved-badge ${item.achieved?"done":""}">
        <i class="ti ti-${item.achieved?"check":"target"}" style="font-size:9px"></i> ${item.achieved?"達成":"未達成"}
      </div>
      <div class="tile-lbl">
        <div class="tile-cat" style="color:${color}">${item.category}</div>
        <div class="tile-name">${item.title}</div>
        <div class="tile-date">${item.createdAt?fmtDate(item.createdAt):""}</div>
      </div>
    </div>
    <div class="rh rh-nw" data-dir="nw"><div class="rh-corner"></div></div>
    <div class="rh rh-n" data-dir="n"><div class="rh-edge-h"></div></div>
    <div class="rh rh-ne" data-dir="ne"><div class="rh-corner"></div></div>
    <div class="rh rh-e" data-dir="e"><div class="rh-edge-v"></div></div>
    <div class="rh rh-se" data-dir="se"><div class="rh-corner"></div></div>
    <div class="rh rh-s" data-dir="s"><div class="rh-edge-h"></div></div>
    <div class="rh rh-sw" data-dir="sw"><div class="rh-corner"></div></div>
    <div class="rh rh-w" data-dir="w"><div class="rh-edge-v"></div></div>
  `;
  attachEvents(t,item.id);
  return t;
}

// DETAIL
function openDetail(id){
  const item=gi(id);if(!item) return;
  detId=id;
  const color=cc(item.category);
  document.getElementById("det-cat").textContent=item.category.toUpperCase();
  document.getElementById("det-cat").style.color=color;
  document.getElementById("det-title").textContent=item.title;
  document.getElementById("det-note").textContent=item.note||"";
  const db=document.getElementById("det-date-badge");
  db.textContent=item.createdAt?"登録: "+fmtDate(item.createdAt):"";
  const ab=document.getElementById("det-ach-badge");
  if(item.achieved){
    ab.style.display="block";
    ab.textContent="✓ 達成"+(item.achievedAt?" "+fmtDate(item.achievedAt):"");
  } else ab.style.display="none";
  document.getElementById("det-img-area").innerHTML=item.imageUrl
    ?`<div class="det-img-wrap"><img class="det-img" src="${item.imageUrl}" alt="${item.title}"></div>`
    :`<div class="det-no-img"><i class="ti ti-photo"></i></div>`;
  const lnk=document.getElementById("det-lnk");
  if(item.link){lnk.style.display="flex";lnk.href=item.link;lnk.style.background=color;}else lnk.style.display="none";
  document.getElementById("det-pin").classList.toggle("pin-on",item.pinned);
  document.getElementById("det-achieved").classList.toggle("achieved-on",item.achieved);
  document.getElementById("det-achieved").innerHTML=item.achieved
    ?`<i class="ti ti-trophy"></i> 達成済み`:`<i class="ti ti-trophy"></i> 達成`;
  document.getElementById("det-wrap").style.display="flex";
}

document.getElementById("det-close").addEventListener("click",()=>document.getElementById("det-wrap").style.display="none");
document.getElementById("det-wrap").addEventListener("click",e=>{if(e.target===document.getElementById("det-wrap")) document.getElementById("det-wrap").style.display="none";});
document.getElementById("det-pin").addEventListener("click",()=>{const i=gi(detId);if(i){i.pinned=!i.pinned;document.getElementById("det-pin").classList.toggle("pin-on",i.pinned);save();renderAll();}});
document.getElementById("det-achieved").addEventListener("click",()=>{
  const i=gi(detId);if(!i) return;
  i.achieved=!i.achieved;
  if(i.achieved&&!i.achievedAt) i.achievedAt=today();
  else if(!i.achieved) i.achievedAt="";
  save();openDetail(detId);renderAll();
});
document.getElementById("det-edit").addEventListener("click",()=>{document.getElementById("det-wrap").style.display="none";openEdit(detId);});
document.getElementById("det-del").addEventListener("click",()=>{
  if(!confirm("削除しますか？")) return;
  items=items.filter(i=>i.id!==detId);
  canvas.querySelectorAll(".tile").forEach(t=>{if(!items.find(i=>i.id===parseInt(t.dataset.id)))t.remove();});
  if(selId===detId){selId=null;updateFloatTb();}
  document.getElementById("det-wrap").style.display="none";
  save();renderAll();
});

// EDIT
function openEdit(id){
  const item=gi(id);if(!item) return;
  editId=id;eImgTab="url";ePendingImg="";
  document.getElementById("edit-title").value=item.title;
  document.getElementById("edit-cat").value=item.category;
  document.getElementById("edit-link").value=item.link||"";
  document.getElementById("edit-note").value=item.note||"";
  document.getElementById("edit-img-url").value=item.imageUrl||"";
  document.getElementById("edit-created").value=item.createdAt||today();
  document.getElementById("edit-achieved").checked=!!item.achieved;
  document.getElementById("edit-ach-date").value=item.achievedAt||"";
  document.getElementById("edit-ach-date-wrap").style.display=item.achieved?"block":"none";
  const wrap=document.getElementById("eprev-wrap");
  if(item.imageUrl){document.getElementById("edit-img-prev").src=item.imageUrl;wrap.style.display="block";}else wrap.style.display="none";
  document.getElementById("etab-url").className="mtab on";document.getElementById("etab-upload").className="mtab off";
  document.getElementById("eurl-sec").style.display="block";document.getElementById("eup-sec").style.display="none";
  document.getElementById("edit-overlay").style.display="flex";
}
document.getElementById("edit-achieved").addEventListener("change",e=>{
  document.getElementById("edit-ach-date-wrap").style.display=e.target.checked?"block":"none";
  if(e.target.checked&&!document.getElementById("edit-ach-date").value) document.getElementById("edit-ach-date").value=today();
});
document.getElementById("close-edit").addEventListener("click",()=>document.getElementById("edit-overlay").style.display="none");
document.getElementById("edit-overlay").addEventListener("click",e=>{if(e.target===document.getElementById("edit-overlay")) document.getElementById("edit-overlay").style.display="none";});
document.getElementById("etab-url").addEventListener("click",()=>{eImgTab="url";document.getElementById("etab-url").className="mtab on";document.getElementById("etab-upload").className="mtab off";document.getElementById("eurl-sec").style.display="block";document.getElementById("eup-sec").style.display="none";});
document.getElementById("etab-upload").addEventListener("click",()=>{eImgTab="upload";document.getElementById("etab-url").className="mtab off";document.getElementById("etab-upload").className="mtab on";document.getElementById("eurl-sec").style.display="none";document.getElementById("eup-sec").style.display="block";});
document.getElementById("edit-img-url").addEventListener("input",e=>{
  const url=e.target.value,prev=document.getElementById("edit-img-prev"),wrap=document.getElementById("eprev-wrap");
  if(url){prev.src=url;prev.onerror=()=>wrap.style.display="none";prev.onload=()=>wrap.style.display="block";}else wrap.style.display="none";
});
document.getElementById("edit-drop-z").addEventListener("click",()=>document.getElementById("edit-file-inp").click());
document.getElementById("edit-file-inp").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file) return;
  const r=new FileReader();r.onload=ev=>{ePendingImg=ev.target.result;document.getElementById("edit-img-prev").src=ePendingImg;document.getElementById("eprev-wrap").style.display="block";};r.readAsDataURL(file);
});
document.getElementById("edit-sub-btn").addEventListener("click",()=>{
  const title=document.getElementById("edit-title").value.trim();if(!title) return;
  const item=gi(editId);if(!item) return;
  const imgUrl=eImgTab==="url"?document.getElementById("edit-img-url").value.trim():ePendingImg;
  item.title=title;item.category=document.getElementById("edit-cat").value;
  item.imageUrl=imgUrl||item.imageUrl;item.link=document.getElementById("edit-link").value.trim();
  item.note=document.getElementById("edit-note").value.trim();
  item.createdAt=document.getElementById("edit-created").value||item.createdAt;
  item.achieved=document.getElementById("edit-achieved").checked;
  item.achievedAt=item.achieved?(document.getElementById("edit-ach-date").value||today()):"";
  document.getElementById("edit-overlay").style.display="none";
  save();
  const old=canvas.querySelector(`[data-id="${item.id}"]`);if(old) old.remove();
  canvas.appendChild(createTile(item));
  renderAll();
});

// ACHIEVED LIST
function openAchieved(){
  const list=document.getElementById("ach-list");
  const ach=items.filter(i=>i.achieved).sort((a,b)=>(b.achievedAt||"").localeCompare(a.achievedAt||""));
  if(ach.length===0){list.innerHTML=`<div class="ach-empty"><i class="ti ti-trophy" style="font-size:32px;display:block;margin-bottom:8px"></i>まだ達成したアイテムはありません</div>`;
  } else {
    list.innerHTML=ach.map(item=>{
      const color=cc(item.category);
      return `<div class="ach-item" data-id="${item.id}">
        ${item.imageUrl?`<img class="ach-thumb" src="${item.imageUrl}" alt="">`:`<div class="ach-thumb-empty"><i class="ti ti-photo"></i></div>`}
        <div class="ach-info">
          <div class="ach-name">${item.title}</div>
          <div class="ach-dates">登録: ${fmtDate(item.createdAt)||"—"} &nbsp;→&nbsp; 達成: ${fmtDate(item.achievedAt)||"—"}</div>
        </div>
        <div class="ach-cat-dot" style="background:${color}" title="${item.category}"></div>
      </div>`;
    }).join("");
    list.querySelectorAll(".ach-item").forEach(el=>{
      el.addEventListener("click",()=>{
        document.getElementById("ach-wrap").style.display="none";
        openDetail(parseInt(el.dataset.id));
      });
    });
  }
  document.getElementById("ach-wrap").style.display="flex";
}
document.getElementById("close-ach").addEventListener("click",()=>document.getElementById("ach-wrap").style.display="none");
document.getElementById("ach-wrap").addEventListener("click",e=>{if(e.target===document.getElementById("ach-wrap")) document.getElementById("ach-wrap").style.display="none";});
document.getElementById("btn-achieved").addEventListener("click",openAchieved);
document.getElementById("mb-achieved").addEventListener("click",openAchieved);

// COLOR PICKER
const PRESETS_EL=document.getElementById("cp-presets");
COLOR_PRESETS.forEach(col=>{
  const btn=document.createElement("button");
  btn.className="cp-preset";btn.style.background=col;
  btn.addEventListener("click",()=>{if(colorPickerCat){catColors[colorPickerCat]=col;save();document.getElementById("color-picker").style.display="none";refreshAllTileColors();updateSidebarCatColors();}});
  PRESETS_EL.appendChild(btn);
});
document.getElementById("cp-custom").addEventListener("input",e=>{
  if(colorPickerCat){catColors[colorPickerCat]=e.target.value;save();refreshAllTileColors();updateSidebarCatColors();}
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".color-picker-wrap")&&!e.target.closest("#ctx-color")) document.getElementById("color-picker").style.display="none";
});

function openColorPicker(cat,x,y){
  colorPickerCat=cat;
  document.getElementById("cp-custom").value=catColors[cat]||"#e8c547";
  const cp=document.getElementById("color-picker");
  cp.style.display="flex";
  const vw=window.innerWidth,vh=window.innerHeight;
  cp.style.left=Math.min(x,vw-170)+"px";
  cp.style.top=Math.min(y,vh-160)+"px";
}

function refreshAllTileColors(){
  canvas.querySelectorAll(".tile").forEach(t=>{
    const id=parseInt(t.dataset.id);const item=gi(id);if(!item) return;
    const color=cc(item.category);
    const cat=t.querySelector(".tile-cat");if(cat) cat.style.color=color;
    const pm=t.querySelector(".pin-mark");if(pm&&item.pinned) pm.style.borderColor=`${color} transparent transparent transparent`;
    t.querySelectorAll(".corner-glow").forEach(g=>g.style.borderColor=color);
  });
}

function updateSidebarCatColors(){
  document.querySelectorAll(".cat-btn").forEach(btn=>{
    const cat=btn.dataset.cat;
    const color=cc(cat);
    btn.style.color=filterMode===cat?color:color+"66";
  });
}

// EVENTS
function attachEvents(t,id){
  function startDrag(clientX,clientY){
    if(isFilterView()) return;
    dragMoved=false;
    const item=gi(id);if(!item) return;
    selId=id;item.z=++maxZ;renderAll();
    const sx=clientX-item.x,sy=clientY-item.y;
    const cr=canvas.getBoundingClientRect();
    function onMove(cx,cy){
      dragMoved=true;t.classList.add("dragging");
      item.x=Math.max(0,Math.min(cx-sx,cr.width-item.w));
      item.y=Math.max(0,Math.min(cy-sy,cr.height-item.h));
      t.style.left=item.x+"px";t.style.top=item.y+"px";
    }
    function onEnd(){
      t.classList.remove("dragging");
      if(!dragMoved) openDetail(id);else save();
      document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);
      document.removeEventListener("touchmove",tm);document.removeEventListener("touchend",te);
      updateFloatTb();
    }
    const mm=e=>onMove(e.clientX,e.clientY),mu=()=>onEnd();
    const tm=e=>{e.preventDefault();const t2=e.touches[0];onMove(t2.clientX,t2.clientY);},te=()=>onEnd();
    document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
    document.addEventListener("touchmove",tm,{passive:false});document.addEventListener("touchend",te);
  }
  t.addEventListener("mousedown",e=>{if(e.target.closest(".rh")||e.button===2) return;e.preventDefault();startDrag(e.clientX,e.clientY);});
  t.addEventListener("touchstart",e=>{if(e.target.closest(".rh")) return;e.preventDefault();const t2=e.touches[0];startDrag(t2.clientX,t2.clientY);},{passive:false});

  t.querySelectorAll(".rh").forEach(rh=>{
    function startResize(cx,cy){
      if(isFilterView()) return;
      const dir=rh.dataset.dir,item=gi(id);if(!item) return;
      selId=id;item.z=++maxZ;
      const sx=cx,sy=cy,ox=item.x,oy=item.y,ow=item.w,oh=item.h;
      const MIN=70,cr=canvas.getBoundingClientRect();
      function onMove(x,y){
        const dx=x-sx,dy=y-sy;
        if(dir.includes("e")) item.w=Math.max(MIN,Math.min(ow+dx,cr.width-item.x));
        if(dir.includes("s")) item.h=Math.max(MIN,Math.min(oh+dy,cr.height-item.y));
        if(dir.includes("w")){const nw=Math.max(MIN,ow-dx);item.x=Math.max(0,ox+ow-nw);item.w=nw;}
        if(dir.includes("n")){const nh=Math.max(MIN,oh-dy);item.y=Math.max(0,oy+oh-nh);item.h=nh;}
        t.style.left=item.x+"px";t.style.top=item.y+"px";t.style.width=item.w+"px";t.style.height=item.h+"px";
      }
      function onEnd(){save();document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);document.removeEventListener("touchmove",tm);document.removeEventListener("touchend",te);}
      const mm=e=>onMove(e.clientX,e.clientY),mu=()=>onEnd();
      const tm=e=>{e.preventDefault();const t2=e.touches[0];onMove(t2.clientX,t2.clientY);},te=()=>onEnd();
      document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
      document.addEventListener("touchmove",tm,{passive:false});document.addEventListener("touchend",te);
    }
    rh.addEventListener("mousedown",e=>{e.preventDefault();e.stopPropagation();startResize(e.clientX,e.clientY);});
    rh.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();const t2=e.touches[0];startResize(t2.clientX,t2.clientY);},{passive:false});
  });

  t.addEventListener("contextmenu",e=>{
    e.preventDefault();selId=id;ctxId=id;renderAll();
    const item=gi(id);
    document.getElementById("ctx-pin-lbl").textContent=item&&item.pinned?"ピン解除":"ピン留め";
    document.getElementById("ctx-ach-lbl").textContent=item&&item.achieved?"達成を取り消す":"達成済みにする";
    ctxMenu.style.display="block";
    const vw=window.innerWidth,vh=window.innerHeight;
    let cx=e.clientX,cy=e.clientY;
    if(cx+160>vw) cx=vw-165;if(cy+230>vh) cy=vh-235;
    ctxMenu.style.left=cx+"px";ctxMenu.style.top=cy+"px";
  });
}

function updateFloatTb(){
  if(selId&&!isFilterView()){
    floatTb.classList.add("visible");
    const item=gi(selId);
    document.getElementById("tf-pin").classList.toggle("pin-on",item&&item.pinned);
    document.getElementById("tf-achieved").classList.toggle("achieved-on",item&&item.achieved);
  } else floatTb.classList.remove("visible");
}

// FLOAT TB
document.getElementById("tf-pin").addEventListener("click",()=>{const i=gi(selId);if(i){i.pinned=!i.pinned;save();renderAll();}});
document.getElementById("tf-achieved").addEventListener("click",()=>{
  const i=gi(selId);if(!i) return;
  i.achieved=!i.achieved;if(i.achieved&&!i.achievedAt) i.achievedAt=today();else if(!i.achieved) i.achievedAt="";
  save();renderAll();
});
document.getElementById("tf-edit").addEventListener("click",()=>{if(selId) openEdit(selId);});
document.getElementById("tf-front").addEventListener("click",()=>{const i=gi(selId);if(i){i.z=++maxZ;save();renderAll();}});
document.getElementById("tf-back").addEventListener("click",()=>{const i=gi(selId);if(i){i.z=1;save();renderAll();}});
document.getElementById("tf-del").addEventListener("click",()=>{
  if(!confirm("削除しますか？")) return;
  items=items.filter(i=>i.id!==selId);
  canvas.querySelectorAll(".tile").forEach(t=>{if(!items.find(i=>i.id===parseInt(t.dataset.id)))t.remove();});
  selId=null;save();updateFloatTb();renderAll();
});

// CTX MENU
document.getElementById("ctx-detail").addEventListener("click",()=>{openDetail(ctxId);ctxMenu.style.display="none";});
document.getElementById("ctx-edit").addEventListener("click",()=>{openEdit(ctxId);ctxMenu.style.display="none";});
document.getElementById("ctx-pin").addEventListener("click",()=>{const i=gi(ctxId);if(i){i.pinned=!i.pinned;save();}ctxMenu.style.display="none";renderAll();});
document.getElementById("ctx-achieved").addEventListener("click",()=>{
  const i=gi(ctxId);if(!i) return;
  i.achieved=!i.achieved;if(i.achieved&&!i.achievedAt) i.achievedAt=today();else if(!i.achieved) i.achievedAt="";
  save();ctxMenu.style.display="none";renderAll();
});
document.getElementById("ctx-front").addEventListener("click",()=>{const i=gi(ctxId);if(i){i.z=++maxZ;save();}ctxMenu.style.display="none";renderAll();});
document.getElementById("ctx-back").addEventListener("click",()=>{const i=gi(ctxId);if(i){i.z=1;save();}ctxMenu.style.display="none";renderAll();});
document.getElementById("ctx-color").addEventListener("click",e=>{
  const i=gi(ctxId);if(!i) return;
  ctxMenu.style.display="none";
  openColorPicker(i.category,e.clientX,e.clientY);
});
document.getElementById("ctx-del").addEventListener("click",()=>{
  if(!confirm("削除しますか？")) return;
  items=items.filter(i=>i.id!==ctxId);
  if(selId===ctxId){selId=null;updateFloatTb();}
  ctxMenu.style.display="none";
  canvas.querySelectorAll(".tile").forEach(t=>{if(!items.find(i=>i.id===parseInt(t.dataset.id)))t.remove();});
  save();renderAll();
});

// FILTER
function setFilter(mode){
  filterMode=mode;selId=null;
  document.getElementById("btn-all").classList.toggle("active",mode==="all");
  document.getElementById("btn-pin").classList.toggle("active",mode==="pin");
  document.getElementById("btn-achieved").classList.toggle("active",mode==="achieved");
  document.querySelectorAll(".cat-btn").forEach(btn=>{
    const cat=btn.dataset.cat,color=cc(cat);
    btn.classList.toggle("active",mode===cat);
    btn.style.color=mode===cat?color:color+"66";
  });
  document.getElementById("mb-all").classList.toggle("active",mode==="all");
  document.getElementById("mb-pin").classList.toggle("active",mode==="pin");
  renderAll();
}
document.getElementById("btn-all").addEventListener("click",()=>setFilter("all"));
document.getElementById("btn-pin").addEventListener("click",()=>setFilter("pin"));
document.querySelectorAll(".cat-btn").forEach(btn=>btn.addEventListener("click",()=>setFilter(btn.dataset.cat)));
document.getElementById("mb-all").addEventListener("click",()=>setFilter("all"));
document.getElementById("mb-pin").addEventListener("click",()=>setFilter("pin"));

// SHUFFLE
function shuffle(){
  if(isFilterView()) return;
  const cr=canvas.getBoundingClientRect();
  const cols=window.innerWidth<600?2:3,pad=12,gp=8;
  const cw=Math.floor((cr.width-pad*2-gp*(cols-1))/cols);
  const ch=Math.round(cw*0.65);
  items.forEach((item,i)=>{item.x=pad+(i%cols)*(cw+gp);item.y=pad+Math.floor(i/cols)*(ch+gp);item.w=cw;item.h=ch;item.z=i+1;});
  maxZ=items.length;save();renderAll();
}
document.getElementById("btn-shuffle").addEventListener("click",shuffle);

// CLEAR
document.getElementById("btn-clear").addEventListener("click",()=>{
  if(items.length===0) return;
  if(confirm("すべてのアイテムを削除しますか？")){
    items=[];selId=null;canvas.querySelectorAll(".tile").forEach(t=>t.remove());save();updateFloatTb();renderAll();
  }
});

// ADD MODAL
function openAdd(){document.getElementById("add-overlay").style.display="flex";}
function closeAdd(){document.getElementById("add-overlay").style.display="none";}
document.getElementById("open-add-side").addEventListener("click",openAdd);
document.getElementById("open-add-top").addEventListener("click",openAdd);
document.getElementById("mb-add").addEventListener("click",openAdd);
document.getElementById("close-add").addEventListener("click",closeAdd);
document.getElementById("add-overlay").addEventListener("click",e=>{if(e.target===document.getElementById("add-overlay")) closeAdd();});
document.getElementById("tab-url").addEventListener("click",()=>{imgTab="url";document.getElementById("tab-url").className="mtab on";document.getElementById("tab-upload").className="mtab off";document.getElementById("url-sec").style.display="block";document.getElementById("up-sec").style.display="none";});
document.getElementById("tab-upload").addEventListener("click",()=>{imgTab="upload";document.getElementById("tab-url").className="mtab off";document.getElementById("tab-upload").className="mtab on";document.getElementById("url-sec").style.display="none";document.getElementById("up-sec").style.display="block";});
document.getElementById("img-url").addEventListener("input",e=>{
  const url=e.target.value,prev=document.getElementById("img-prev"),wrap=document.getElementById("prev-wrap");
  if(url){prev.src=url;prev.onerror=()=>wrap.style.display="none";prev.onload=()=>wrap.style.display="block";}else wrap.style.display="none";
});
document.getElementById("drop-z").addEventListener("click",()=>document.getElementById("file-inp").click());
document.getElementById("file-inp").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file) return;
  const r=new FileReader();r.onload=ev=>{pendingImg=ev.target.result;document.getElementById("img-prev").src=pendingImg;document.getElementById("prev-wrap").style.display="block";};r.readAsDataURL(file);
});
document.getElementById("sub-btn").addEventListener("click",()=>{
  const title=document.getElementById("inp-title").value.trim();if(!title) return;
  const imageUrl=imgTab==="url"?document.getElementById("img-url").value.trim():pendingImg;
  const cr=canvas.getBoundingClientRect();
  const cols=window.innerWidth<600?2:3;
  const dw=Math.floor((cr.width-24-(cols-1)*8)/cols),dh=Math.round(dw*0.65);
  items.push({id:Date.now(),title,category:document.getElementById("inp-cat").value,imageUrl,link:document.getElementById("inp-link").value.trim(),note:document.getElementById("inp-note").value.trim(),pinned:false,achieved:false,achievedAt:"",createdAt:today(),x:16+Math.random()*60,y:16+Math.random()*40,w:dw,h:dh,z:++maxZ});
  closeAdd();
  ["inp-title","img-url","inp-link","inp-note"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("prev-wrap").style.display="none";pendingImg="";
  save();renderAll();
});

// GLOBAL EVENTS
document.addEventListener("click",e=>{
  if(!e.target.closest(".ctx")) ctxMenu.style.display="none";
  if(!e.target.closest(".tile")&&!e.target.closest(".ctx")&&!e.target.closest(".float-tb")){
    selId=null;canvas.querySelectorAll(".tile").forEach(t=>t.classList.remove("selected"));updateFloatTb();
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    selId=null;ctxMenu.style.display="none";
    ["det-wrap","edit-overlay","add-overlay","ach-wrap"].forEach(id=>document.getElementById(id).style.display="none");
    document.getElementById("color-picker").style.display="none";
    canvas.querySelectorAll(".tile").forEach(t=>t.classList.remove("selected"));updateFloatTb();
  }
  if((e.key==="Delete"||e.key==="Backspace")&&selId&&!isFilterView()&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){
    if(!confirm("削除しますか？")) return;
    items=items.filter(i=>i.id!==selId);
    canvas.querySelectorAll(".tile").forEach(t=>{if(!items.find(i=>i.id===parseInt(t.dataset.id)))t.remove();});
    selId=null;save();updateFloatTb();renderAll();
  }
});

load();
// 既存データにcreatedAtがなければ付与
items.forEach(i=>{if(!i.createdAt) i.createdAt=today();if(i.achieved===undefined) i.achieved=false;if(!i.achievedAt) i.achievedAt="";});
renderAll();
updateSidebarCatColors();
</script>
